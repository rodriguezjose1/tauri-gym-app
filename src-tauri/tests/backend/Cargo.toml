[package]
name = "gym-backend-tests"
version = "0.1.0"
edition = "2021"
publish = false

# A standalone test harness: no native app, secrets or production DB initialization.
[workspace]

[lib]
path = "harness.rs"
doctest = false

[dependencies]
# Match the versions recorded in src-tauri/Cargo.lock.
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.219", features = ["derive"] }

[dev-dependencies]
tempfile = "=3.20.0"
