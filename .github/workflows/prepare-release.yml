name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Tipo de versión a publicar
        required: true
        default: minor
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Verify pull request permission
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          allowed=$(gh api "repos/$GITHUB_REPOSITORY/actions/permissions/workflow" --jq '.can_approve_pull_request_reviews')
          if [ "$allowed" != "true" ]; then
            echo "::error::Habilitá Settings > Actions > General > Allow GitHub Actions to create and approve pull requests."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore backend Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-backend-tests
          workspaces: src-tauri/tests/backend -> target
      - run: npm ci
      - name: Calculate next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          current=$(node -p "require('./package.json').version")
          next=$(node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); const bump=process.argv[2]; console.log(bump==="major" ? `${a+1}.0.0` : bump==="minor" ? `${a}.${b+1}.0` : `${a}.${b}.${c+1}`)' "$current" "$BUMP")
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "branch=chore/release-v$next" >> "$GITHUB_OUTPUT"
      - name: Update synchronized version files
        run: npm run release:version -- ${{ steps.version.outputs.version }}
      - name: Validate synchronized versions
        run: npm run release:version -- --check
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm run test:run
      - name: Test backend
        run: npm run test:backend
      - name: Build frontend
        run: npm run build
      - name: Test updater manifest generation
        run: node --test scripts/update-manifest.test.mjs
      - name: Create release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        shell: bash
        run: |
          existing=$(gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -n "$existing" ]; then
            echo "Release PR already exists: $existing"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_sha=""
          if git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"; then
            remote_sha=$(git rev-parse "origin/$BRANCH")
          fi
          git switch -c "$BRANCH"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): bump version to $VERSION"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$BRANCH:$remote_sha" origin "HEAD:refs/heads/$BRANCH"
          else
            git push --set-upstream origin "$BRANCH"
          fi
          gh pr create --base main --head "$BRANCH" --title "chore(release): bump version to $VERSION" --body "Prepara Quality GYM $VERSION. Al mergear este PR se validará, compilará y publicará automáticamente la release de Windows."
