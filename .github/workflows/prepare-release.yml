name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Tipo de versión a publicar
        required: true
        default: minor
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Calculate next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          current=$(node -p "require('./package.json').version")
          next=$(node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); const bump=process.argv[2]; console.log(bump==="major" ? `${a+1}.0.0` : bump==="minor" ? `${a}.${b+1}.0` : `${a}.${b}.${c+1}`)' "$current" "$BUMP")
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "branch=chore/release-v$next" >> "$GITHUB_OUTPUT"
      - name: Update synchronized version files
        run: npm run release:version -- ${{ steps.version.outputs.version }}
      - name: Validate release candidate
        run: |
          npm run release:version -- --check
          npm run lint
          npm run test:all
          npm run build
          node --test scripts/update-manifest.test.mjs
          cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Create release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        shell: bash
        run: |
          existing=$(gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -n "$existing" ]; then
            echo "Release PR already exists: $existing"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): bump version to $VERSION"
          git push --set-upstream origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "chore(release): bump version to $VERSION" --body "Prepara Quality GYM $VERSION. Al mergear este PR se validará, compilará y publicará automáticamente la release de Windows."
