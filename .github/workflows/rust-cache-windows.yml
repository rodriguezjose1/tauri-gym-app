name: Prepare Windows Rust cache
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-cache-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cache:
    # Tags can restore the default branch cache, but not another tag's cache.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-rust-dependencies
          workspaces: |
            src-tauri -> target
            src-tauri/tests/backend -> target
          cache-workspace-crates: false
      - run: npm ci
      - name: Configure build without production credentials
        shell: pwsh
        run: Copy-Item src-tauri/src/config/api_keys.example.rs src-tauri/src/config/api_keys.rs
      - run: npm run test:backend
      - name: Compile release dependencies
        run: npx tauri build --no-bundle -- --locked
